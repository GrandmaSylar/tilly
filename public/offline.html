<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6E564C">
  <title>You're offline · Tilly's Gallery</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#FBF6F2;color:#2E2420;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{max-width:340px}
    img{width:180px;height:auto}
    h1{margin:24px 0 8px;font-size:1.5rem;letter-spacing:-.02em}
    p{margin:0 0 24px;color:#74645B;line-height:1.5}
    button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#6E564C;color:#fff;font:600 1rem system-ui,sans-serif}
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="Tilly's Gallery" width="624" height="414">
    <h1>You're offline</h1>
    <p>We can't reach the store right now. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
